<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Three-Tier Todo</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172033; background: #f2f5fa; }
      body { max-width: 760px; margin: 3rem auto; padding: 0 1rem; }
      main { background: white; border: 1px solid #dce3ed; border-radius: 12px; padding: 2rem; box-shadow: 0 8px 26px #17203312; }
      h1 { margin-top: 0; }
      form { display: flex; gap: .75rem; }
      input { flex: 1; min-width: 0; padding: .8rem; border: 1px solid #aeb9ca; border-radius: 6px; font: inherit; }
      button { padding: .8rem 1rem; border: 0; border-radius: 6px; background: #1769aa; color: white; font: inherit; cursor: pointer; }
      li { padding: .7rem 0; border-bottom: 1px solid #e7ebf1; overflow-wrap: anywhere; }
      #status { min-height: 1.5rem; color: #a32525; }
      @media (max-width: 520px) { form { flex-direction: column; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Three-Tier Todo</h1>
      <p>Nginx web tier → private API tier → private MariaDB database.</p>
      <form id="record-form">
        <input id="title" maxlength="200" required aria-label="Record title" placeholder="Add a record">
        <button type="submit">Add record</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <h2>Saved records</h2>
      <ul id="records"></ul>
    </main>
    <script>
      const form = document.querySelector("#record-form");
      const titleInput = document.querySelector("#title");
      const status = document.querySelector("#status");
      const recordsList = document.querySelector("#records");

      async function loadRecords() {
        const response = await fetch("/api/records");
        const records = await response.json();
        if (!response.ok) throw new Error(records.error || "Could not load records");
        recordsList.replaceChildren();
        for (const record of records) {
          const item = document.createElement("li");
          item.textContent = record.title + " — " + new Date(record.created_at).toLocaleString();
          recordsList.append(item);
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        status.textContent = "";
        try {
          const response = await fetch("/api/records", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ title: titleInput.value })
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || "Could not save record");
          titleInput.value = "";
          await loadRecords();
        } catch (error) {
          status.textContent = error.message;
        }
      });

      loadRecords().catch((error) => { status.textContent = error.message; });
    </script>
  </body>
</html>
